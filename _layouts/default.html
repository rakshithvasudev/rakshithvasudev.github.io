<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&family=Inter:wght@400;600;700&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
  {% if page.math %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
  {% endif %}
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="site-links">
        <a href="{{ '/' | relative_url }}">Posts</a>
        <a href="{{ '/tags/' | relative_url }}">Tags</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/feed.xml' | relative_url }}" title="RSS feed">RSS</a>
        <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
      </div>
    </nav>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ 'now' | date: '%Y' }} {{ site.author }}</span>
    <span>
      <a href="https://github.com/{{ site.github_username }}">GitHub</a> ·
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </span>
  </footer>

  <script>
    document.getElementById("theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var current = root.getAttribute("data-theme");
      if (!current) {
        current = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      var next = current === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".post-content svg[role='img']").forEach(function (svg) {
        svg.addEventListener("click", function () {
          var box = document.createElement("div");
          box.className = "svg-lightbox";
          box.appendChild(svg.cloneNode(true));
          function onKey(e) { if (e.key === "Escape") close(); }
          function close() { box.remove(); document.removeEventListener("keydown", onKey); }
          box.addEventListener("click", close);
          document.addEventListener("keydown", onKey);
          document.body.appendChild(box);
        });
      });
    });
  </script>
  <script defer src="{{ '/assets/js/review.js' | relative_url }}"></script>
  {% include analytics.html %}
</body>
</html>
